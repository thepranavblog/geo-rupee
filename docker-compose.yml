services:

  # ---------- Kafka ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      JVMFLAGS: "-Xmx128m -Xms64m"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.3"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/setup_topics.sh"]
    volumes:
      - ./kafka:/scripts
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ---------- Producers ----------
  gdelt-producer:
    build: ./producers
    command: python gdelt_poller.py
    depends_on:
      - kafka-setup
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  yahoo-producer:
    build: ./producers
    command: python yahoo_finance_poller.py
    depends_on:
      - kafka-setup
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  # ---------- Spark ----------
  spark-master:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_DAEMON_MEMORY: 256m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  spark-worker:
    image: apache/spark:3.5.0
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --memory 512m --cores 1 spark://spark-master:7077
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

  spark-submit:
    image: apache/spark:3.5.0
    depends_on:
      - spark-master
      - spark-worker
      - kafka-setup
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.extraJavaOptions=-Divy.home=/tmp/ivy2
        --conf spark.driver.memory=512m
        --conf spark.executor.memory=512m
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4
        --py-files /app/config.py,/app/schemas.py
        /app/streaming_job.py
    volumes:
      - ./spark:/app
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ---------- Airflow ----------
  airflow-init:
    build: ./airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/data
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  airflow-webserver:
    build: ./airflow
    command: webserver
    depends_on:
      - airflow-init
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt_project:/dbt_project
      - ./data:/data
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  airflow-scheduler:
    build: ./airflow
    command: scheduler
    depends_on:
      - airflow-init
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt_project:/dbt_project
      - ./data:/data
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ---------- Dashboard ----------
  streamlit:
    build: ./dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

volumes:
  duckdb-data:
